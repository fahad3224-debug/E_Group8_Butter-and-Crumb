<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">A Crumbery delivery scooter carrying a cake box</title>
  <defs>
    <pattern id="stripes" width="40" height="300" patternUnits="userSpaceOnUse">
      <rect width="20" height="300" fill="#C9503A"/>
      <rect x="20" width="20" height="300" fill="#BF4834"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#stripes)"/>

  <!-- road -->
  <rect x="0" y="240" width="400" height="60" fill="#3B2314"/>
  <g fill="#F8E08E">
    <rect x="20" y="266" width="44" height="7" rx="3.5"/>
    <rect x="110" y="266" width="44" height="7" rx="3.5"/>
    <rect x="200" y="266" width="44" height="7" rx="3.5"/>
    <rect x="290" y="266" width="44" height="7" rx="3.5"/>
  </g>

  <!-- speed lines -->
  <g stroke="#FCEBD8" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="28" y1="150" x2="78" y2="150"/>
    <line x1="14" y1="176" x2="70" y2="176"/>
    <line x1="34" y1="202" x2="80" y2="202"/>
  </g>

  <!-- map pin -->
  <g transform="translate(326 52)">
    <path d="M24 0C10.7 0 0 10.4 0 23.4 0 41 24 64 24 64S48 41 48 23.4C48 10.4 37.3 0 24 0Z" fill="#FCEBD8"/>
    <circle cx="24" cy="23" r="9" fill="#C9503A"/>
  </g>

  <!-- wheels -->
  <g>
    <circle cx="132" cy="214" r="27" fill="#3B2314"/>
    <circle cx="132" cy="214" r="10" fill="#FCEBD8"/>
    <circle cx="288" cy="214" r="27" fill="#3B2314"/>
    <circle cx="288" cy="214" r="10" fill="#FCEBD8"/>
  </g>

  <!-- scooter body -->
  <path d="M96 204Q96 166 144 166H206Q224 166 226 186V204Z" fill="#F8E08E" stroke="#3B2314" stroke-width="5" stroke-linejoin="round"/>
  <path d="M220 198H272" stroke="#3B2314" stroke-width="12" stroke-linecap="round"/>
  <path d="M272 198L256 110" stroke="#3B2314" stroke-width="10" stroke-linecap="round"/>
  <path d="M240 106H276" stroke="#3B2314" stroke-width="9" stroke-linecap="round"/>
  <path d="M258 214A30 30 0 0 1 318 214" fill="none" stroke="#F8E08E" stroke-width="9" stroke-linecap="round"/>
  <circle cx="266" cy="134" r="9" fill="#F8E08E" stroke="#3B2314" stroke-width="4"/>

  <!-- cake box -->
  <g transform="rotate(-3 152 136)">
    <rect x="104" y="104" width="98" height="64" rx="7" fill="#FCEBD8" stroke="#3B2314" stroke-width="5"/>
    <rect x="146" y="104" width="14" height="64" fill="#C9503A"/>
    <rect x="104" y="128" width="98" height="12" fill="#C9503A"/>
    <path d="M153 104C140 88 126 92 132 102 136 108 146 106 153 104ZM153 104C166 88 180 92 174 102 170 108 160 106 153 104Z" fill="#C9503A" stroke="#3B2314" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
